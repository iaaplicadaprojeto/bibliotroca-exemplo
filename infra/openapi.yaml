openapi: 3.0.1
info:
  title: API_NOME
  description: Catalogo de livros disponiveis para troca no bairro
  version: "1.0"
paths:
  /livros:
    post:
      summary: Disponibiliza um livro para troca
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Entrada"
      responses:
        "201":
          description: Livro disponibilizado
        "400":
          description: Dados invalidos
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: URI_GRAVAR
    get:
      summary: Consulta os livros disponiveis em um bairro
      parameters:
        - name: bairro
          in: query
          required: true
          schema:
            type: string
        - name: limite
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Lista de livros
        "400":
          description: Parametro obrigatorio ausente
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: URI_CONSULTAR
    options:
      summary: Responde a verificacao previa do navegador
      responses:
        "200":
          description: Cabecalhos de CORS
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 200}'
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin:
                "'*'"
              method.response.header.Access-Control-Allow-Methods:
                "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers:
                "'Content-Type'"
  /livros/trocado:
    post:
      summary: Marca um livro como trocado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Troca"
      responses:
        "200":
          description: Livro marcado como trocado
        "400":
          description: Dados invalidos
        "404":
          description: Livro nao encontrado
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
        uri: URI_MARCAR
    options:
      summary: Responde a verificacao previa do navegador
      responses:
        "200":
          description: Cabecalhos de CORS
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 200}'
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin:
                "'*'"
              method.response.header.Access-Control-Allow-Methods:
                "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers:
                "'Content-Type'"
components:
  schemas:
    Entrada:
      type: object
      required:
        - bairro
        - titulo
        - autor
        - estado
      properties:
        bairro:
          type: string
          description: Chave de particao. Unica informacao de local, RD-01.
        titulo:
          type: string
        autor:
          type: string
        estado:
          type: string
          enum: [novo, bom, gasto]
        capa_base64:
          type: string
          format: byte
          description: Foto da capa, ate 2 MB. RF-02 e RD-02.
    Troca:
      type: object
      required:
        - bairro
        - id_livro
      properties:
        bairro:
          type: string
        id_livro:
          type: string
